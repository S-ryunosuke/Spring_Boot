<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<link rel="stylesheet" type="text/css" href="../css/common.css">
		<title>新規登録</title>
	</head>
	<body>
		<div id="wapper">
				<a href="../" class="menu-link">メニュー</a><br>
			<div class="menu">
				<h2>新規登録画面</h2>
			</div>
			<form th:action="@{/members/confirm}" th:object="${memberForm}" method="post">
				<table class="ct">
					<tr>
						<th>社員ID</th>
						<td>
							<input type="text" th:field="*{id}">
							<div th:errors="*{id}" class="error"></div>
						</td>
						
					</tr>
					<tr>
						<th>氏名</th>
						<td>
							<input type="text" th:field="*{name}">
							<div th:errors="*{name}" class="error"></div>
						</td>
					</tr>
					<tr>	
						<th>年齢</th>
						<td><input type="text" th:field="*{age}"></td>
					</tr>
					<tr>
						<th>性別</th>
						<td>
							男<input type="radio" th:field="*{sex}" value="0">
							女<input type="radio" th:field="*{sex}" value="1">
						</td>
					</tr>
					<tr>
						<th>住所</th>
						<td><input type="text" th:field="*{address}"></td>
					</tr>
					<tr>
						<th>電話番号</th>
						<td><input type="text" th:field="*{telephone}"></td>
					</tr>
					<tr>
						<th>メールアドレス</th>
						<td><input type="text" th:field="*{mail}"></td>
					</tr>
					<tr>
						<th>役職</th>
						<td>
							<select th:field="*{position}">
								<option th:each="position : ${positionList}"
								        th:value="${position.name}" th:text="${position.name}">
								</option>
							</select>
						</td>
					</tr>
					<tr>
						<th>事業所</th>
						<td>
							<select th:field="*{place}">
								<option th:each="place : ${placeList}"
								        th:value="${place.name}" th:text="${place.name}">
								</option>
							</select>
						</td>
					</tr>
				</table>
				<div class="menu">
					<input type="submit" value="登録" class="btn">
				</div>
			</form>
		</div>
	</body>
</html>
