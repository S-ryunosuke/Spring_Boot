<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<link rel="stylesheet" type="text/css" href="../css/common.css">
		<title>新規登録確認</title>
	</head>
	<body>
		<div id="wapper">
			<div class="menu">
				<a href="../" class="menu-link">メニュー</a><br>
			</div>
			<div class="menu">
				<h2>新規登録&nbsp;確認画面</h2>
				<p>以下のデータを登録します&nbsp;よろしいですか</p>
			</div>
			<form th:action="@{/members/add}" th:object="${memberForm}" method="post">
				<input type="hidden" name="id" th:value="${memberForm.id}">
				<input type="hidden" name="name" th:value="${memberForm.name}">
				<input type="hidden" name="age" th:value="${memberForm.age}">
				<input type="hidden" name="sex" th:value="${memberForm.sex}">
				<input type="hidden" name="address" th:value="${memberForm.address}">
				<input type="hidden" name="telephone" th:value="${memberForm.telephone}">
				<input type="hidden" name="mail" th:value="${memberForm.mail}">
				<input type="hidden" name="position" th:value="${memberForm.position}">
				<input type="hidden" name="place" th:value="${memberForm.place}">
				
				<table class="ct">
					<tr>
						<th>社員ID</th>
						<td th:text="${memberForm.id}"></td>
					</tr>
					<tr>
						<th>氏名</th>
						<td th:text="${memberForm.name}"></td>
					</tr>
					<tr>
						<th>年齢</th>
						<td th:text="${memberForm.age}"></td>
					</tr>
					<tr>
						<th>性別</th>
						<td th:text="${memberForm.sex == 0 ? '男' : '女'}"></td>
					</tr>
					<tr>
						<th>住所</th>
						<td th:text="${memberForm.address}"></td>
					</tr>
					<tr>
						<th>電話番号</th>
						<td th:text="${memberForm.telephone}"></td>
					</tr>
					<tr>
						<th>メールアドレス</th>
						<td th:text="${memberForm.mail}"></td>
					</tr>
					<tr>
						<th>役職</th>
						<td th:text="${memberForm.position}"></td>
					</tr>
					<tr>
						<th>事業所</th>
						<td th:text="${memberForm.place}"></td>
					</tr>
				</table>
				
				<div class="menu">
					<input type="submit" value="登録" class="btn">
					<button type="button" onclick="history.back()" class="btn">戻る</button>
				</div>
			</form>
		</div>
	</body>
</html>
